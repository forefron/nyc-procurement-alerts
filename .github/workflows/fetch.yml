name: NYC procurement alerts

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch: {}       # lets you run it manually with one click

permissions:
  contents: write             # allows the job to save state.json back to the repo

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch new opportunities and post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 fetcher.py

      - name: Save state (so nothing ever posts twice)
        run: |
          git config user.name "alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A state.json feed.json
          git diff --cached --quiet || git commit -m "update alert state [skip ci]"
          git push
